[project]
name = "semantic-cache-gateway"
version = "1.0.0"
description = "LLM gateway that serves semantically similar queries from cache and falls back to RAG on a miss."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Keerthana" }]

# Dependencies are pinned in requirements*.txt (deploy hosts like Render read those).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: uses the real sentence-transformers model (run with `pytest -m slow`)"]
filterwarnings = [
    "error",  # a new warning fails the suite instead of scrolling past
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["RUF001", "RUF003"]  # tests intentionally use non-ASCII strings

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
